name: Integration Tests

# Runs the live-store integration test suite (src/integration/integration.test.ts).
# Triggers:
#   - schedule: nightly at 06:17 UTC
#   - workflow_call: invoked by release.yml on every tag push, gating publish
#   - workflow_dispatch: manual trigger
# Requires the LEMONSQUEEZY_TEST_API_KEY repository secret (and
# LEMONSQUEEZY_TEST_STORE_ID) to be configured under:
#   Settings > Secrets and variables > Actions.
# Read paths are pure GET. Write path creates and tears down a throwaway
# discount, webhook, and customer (sweep step reaps anything older than 1h).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check for integration secret
        id: check
        env:
          API_KEY: ${{ secrets.LEMONSQUEEZY_TEST_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::notice::LEMONSQUEEZY_TEST_API_KEY not configured -- skipping integration tests. Forks and repos without a test store are expected to hit this path. To run live tests, add the secret under Settings > Secrets and variables > Actions."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.configured == 'true'

      - name: Run integration tests against live store
        if: steps.check.outputs.configured == 'true'
        env:
          LEMONSQUEEZY_TEST_API_KEY: ${{ secrets.LEMONSQUEEZY_TEST_API_KEY }}
          LEMONSQUEEZY_TEST_STORE_ID: ${{ secrets.LEMONSQUEEZY_TEST_STORE_ID }}
        run: npm test
