name: Integration Tests

# Runs the live-store integration test suite (src/integration/integration.test.ts).
# Triggers:
#   - schedule: nightly at 06:17 UTC
#   - workflow_call: invoked by release.yml on every tag push, gating publish
#   - workflow_dispatch: manual trigger
# Requires the LEMONSQUEEZY_TEST_API_KEY repository secret (and
# LEMONSQUEEZY_TEST_STORE_ID) to be configured under:
#   Settings > Secrets and variables > Actions.
# Read paths are pure GET. Write path creates and tears down a throwaway
# discount, webhook, and customer (sweep step reaps anything older than 1h).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check for integration secrets
        id: check
        env:
          API_KEY: ${{ secrets.LEMONSQUEEZY_TEST_API_KEY }}
          STORE_ID: ${{ secrets.LEMONSQUEEZY_TEST_STORE_ID }}
        run: |
          # Both must be set -- the test code requires API_KEY *and* STORE_ID
          # and silently skips every suite via `{ skip: !enabled }` if either
          # is missing. Half-configured would let CI go green with zero
          # integration coverage, so fail loudly instead.
          if [ -z "$API_KEY" ] && [ -z "$STORE_ID" ]; then
            echo "::notice::LEMONSQUEEZY_TEST_API_KEY and LEMONSQUEEZY_TEST_STORE_ID not configured -- skipping integration tests. Forks and repos without a test store are expected to hit this path. To run live tests, add both secrets under Settings > Secrets and variables > Actions."
            echo "configured=false" >> $GITHUB_OUTPUT
          elif [ -z "$API_KEY" ] || [ -z "$STORE_ID" ]; then
            echo "::error::Integration secrets are half-configured. Both LEMONSQUEEZY_TEST_API_KEY and LEMONSQUEEZY_TEST_STORE_ID must be set together, or both unset. Set the missing one or remove the other."
            exit 1
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v6
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.configured == 'true'

      - name: Run integration tests against live store
        if: steps.check.outputs.configured == 'true'
        env:
          LEMONSQUEEZY_TEST_API_KEY: ${{ secrets.LEMONSQUEEZY_TEST_API_KEY }}
          LEMONSQUEEZY_TEST_STORE_ID: ${{ secrets.LEMONSQUEEZY_TEST_STORE_ID }}
        run: npm test
