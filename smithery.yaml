# Smithery configuration file: https://smithery.ai/docs/build/project-config/smithery.yaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - lemonsqueezyApiKey
    properties:
      lemonsqueezyApiKey:
        type: string
        description: LemonSqueezy API key (Bearer token). Required.
      lemonsqueezyApiKeyCommand:
        type: string
        description: Shell command that prints the API key on stdout. Used in place of lemonsqueezyApiKey for secret managers (1Password, pass, etc.).
      lemonsqueezyTestApiKey:
        type: string
        description: Separate API key used by the integration test suite. Optional.
      lemonsqueezyAllowedStoreIds:
        type: string
        description: Comma-separated allowlist of store IDs. When set, the server refuses operations targeting any store ID outside the list.
      lemonsqueezyMaxRefundAmountCents:
        type: string
        description: Cap on a single refund amount, in cents. Refund calls above this fail before reaching the API.
      lemonsqueezyDestructiveRateLimit:
        type: string
        description: Positive integer. Maximum destructive tool calls allowed per 60-second rolling window (per server instance). Example "5". Combines with lemonsqueezyRateLimitPerClass; both must pass.
      lemonsqueezyDisableClasses:
        type: string
        description: Comma-separated list of authority classes to refuse outright. Valid classes are read, pii, mutate, money, recurring, key, webhook. Example "money,recurring,pii" lets reads through but blocks refunds, subscription changes, and customer-record access. Unknown class names cause server startup to fail.
      lemonsqueezyRateLimitPerClass:
        type: string
        description: Per-authority-class rolling rate limits, comma-separated. Each entry is "class:N", "class:N/m", or "class:N/h"; bare numbers default to per-minute. Example "money:2/h,recurring:5/h,key:10/m". Composes with lemonsqueezyDestructiveRateLimit. This is the load-bearing setting for runaway-agent prevention -- LemonSqueezy permissions cannot express per-class call ceilings.
      lemonsqueezyLog:
        type: string
        description: Structured-log level (stderr). One of off, error, audit (recommended for production), all, json. Unset disables logging.
        enum:
          - "off"
          - error
          - audit
          - all
          - json
      lemonsqueezySinkUrl:
        type: string
        description: Base URL of an @yawlabs/lemonsqueezy-webhook-sink instance. When set, the ls_sink_* tools forward to it. Without this the sink bridge tools return "not configured".
      lemonsqueezySinkAdminToken:
        type: string
        description: Bearer token used to authenticate to the webhook sink's admin endpoints. Required for the ls_sink_* tools to function.
  commandFunction:
    # Returns the CLI invocation that starts the MCP server on stdio.
    # Smithery validates the inbound config against configSchema before
    # calling this function, so required fields are guaranteed present.
    |-
      (config) => {
        const env = { LEMONSQUEEZY_API_KEY: config.lemonsqueezyApiKey };
        if (config.lemonsqueezyApiKeyCommand) env.LEMONSQUEEZY_API_KEY_COMMAND = config.lemonsqueezyApiKeyCommand;
        if (config.lemonsqueezyTestApiKey) env.LEMONSQUEEZY_TEST_API_KEY = config.lemonsqueezyTestApiKey;
        if (config.lemonsqueezyAllowedStoreIds) env.LEMONSQUEEZY_ALLOWED_STORE_IDS = config.lemonsqueezyAllowedStoreIds;
        if (config.lemonsqueezyMaxRefundAmountCents) env.LEMONSQUEEZY_MAX_REFUND_AMOUNT_CENTS = config.lemonsqueezyMaxRefundAmountCents;
        if (config.lemonsqueezyDestructiveRateLimit) env.LEMONSQUEEZY_DESTRUCTIVE_RATE_LIMIT = config.lemonsqueezyDestructiveRateLimit;
        if (config.lemonsqueezyDisableClasses) env.LEMONSQUEEZY_DISABLE_CLASSES = config.lemonsqueezyDisableClasses;
        if (config.lemonsqueezyRateLimitPerClass) env.LEMONSQUEEZY_RATE_LIMIT_PER_CLASS = config.lemonsqueezyRateLimitPerClass;
        if (config.lemonsqueezyLog) env.LEMONSQUEEZY_LOG = config.lemonsqueezyLog;
        if (config.lemonsqueezySinkUrl) env.LEMONSQUEEZY_SINK_URL = config.lemonsqueezySinkUrl;
        if (config.lemonsqueezySinkAdminToken) env.LEMONSQUEEZY_SINK_ADMIN_TOKEN = config.lemonsqueezySinkAdminToken;
        return {
          command: 'npx',
          args: ['-y', '@yawlabs/lemonsqueezy-mcp'],
          env,
        };
      }
