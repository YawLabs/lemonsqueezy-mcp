# Smithery configuration file: https://smithery.ai/docs/build/project-config/smithery.yaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    # No field is required: the API key can come from lemonsqueezyApiKey,
    # lemonsqueezyTestApiKey or lemonsqueezyApiKeyCommand, and the License API
    # tools need none of them.
    type: object
    properties:
      lemonsqueezyApiKey:
        type: string
        description: LemonSqueezy API key (Bearer token). Required for the management-API tools unless lemonsqueezyApiKeyCommand or lemonsqueezyTestApiKey is set.
      lemonsqueezyApiKeyCommand:
        type: string
        description: Command that prints the API key on stdout. Run directly, not through a shell -- arguments are split on spaces and tabs and quotes group an argument, but pipes, redirects and $VAR expansion do not work; put anything more complex in a script run through its interpreter (e.g. sh get-key.sh). Takes precedence over lemonsqueezyApiKey and lemonsqueezyTestApiKey. For secret managers (1Password, pass, etc.).
      lemonsqueezyTestApiKey:
        type: string
        description: Test-mode API key. When set, the server uses it INSTEAD of lemonsqueezyApiKey (announced once on stderr), unless lemonsqueezyApiKeyCommand is set. Leave empty for production.
      lemonsqueezyAllowedStoreIds:
        type: string
        description: Comma-separated allowlist of store IDs. Tools that take a storeId reject other stores and require one; list-by-parent tools require a parent-ID filter. Tools addressed by a resource ID other than a storeId (e.g. ls_get_order, ls_refund_order), ls_list_stores, ls_list_affiliates and the License API tools are not gated; see the README.
      lemonsqueezyMaxRefundAmountCents:
        type: integer
        minimum: 1
        description: Cap on a single refund amount, in cents. Refund calls above this fail before reaching the API.
      lemonsqueezyDestructiveRateLimit:
        type: integer
        minimum: 1
        description: Maximum destructive tool calls allowed per 60-second rolling window (per server instance). Example 5. Counts refunds, cancellations, archives, deletes, usage reports, subscription-item quantity changes, license deactivations and the destructive update inputs listed in the README; those calls are also audited. Combines with lemonsqueezyRateLimitPerClass; both must pass.
      lemonsqueezyDisableClasses:
        type: string
        description: Comma-separated list of authority classes to refuse outright. Valid classes are read, pii, mutate, money, recurring, key, webhook. Example "money,recurring,pii" blocks refunds, subscription changes and usage reporting, and the dedicated customer tools; read-class tools still return customer names and emails. Unknown class names cause server startup to fail.
      lemonsqueezyRateLimitPerClass:
        type: string
        description: Per-authority-class rolling rate limits, comma-separated. Each entry is "class:N", "class:N/m", or "class:N/h"; bare numbers default to per-minute. Example "money:2/h,recurring:5/h,key:10/m". Composes with lemonsqueezyDestructiveRateLimit. This is the load-bearing setting for runaway-agent prevention -- LemonSqueezy permissions cannot express per-class call ceilings.
      lemonsqueezyLog:
        type: string
        description: Structured-log level (stderr). One of off, error, audit (recommended for production), all, json. Unset disables logging.
        enum:
          - "off"
          - error
          - audit
          - all
          - json
      lemonsqueezySinkUrl:
        type: string
        description: Base URL of an @yawlabs/lemonsqueezy-webhook-sink instance. When set, the ls_sink_* tools forward to it. Without this the sink bridge tools return "not configured".
      lemonsqueezySinkAdminToken:
        type: string
        description: Bearer token used to authenticate to the webhook sink's admin endpoints. Required for the ls_sink_* tools to function.
  commandFunction:
    # Returns the CLI invocation that starts the MCP server on stdio.
    # Smithery validates the inbound config against configSchema before
    # calling this function. No field is required (the key can come from
    # lemonsqueezyApiKey, lemonsqueezyTestApiKey or lemonsqueezyApiKeyCommand), so every env var is
    # set only when its field is present.
    |-
      (config) => {
        const env = {};
        if (config.lemonsqueezyApiKey) env.LEMONSQUEEZY_API_KEY = config.lemonsqueezyApiKey;
        if (config.lemonsqueezyApiKeyCommand) env.LEMONSQUEEZY_API_KEY_COMMAND = config.lemonsqueezyApiKeyCommand;
        if (config.lemonsqueezyTestApiKey) env.LEMONSQUEEZY_TEST_API_KEY = config.lemonsqueezyTestApiKey;
        if (config.lemonsqueezyAllowedStoreIds) env.LEMONSQUEEZY_ALLOWED_STORE_IDS = config.lemonsqueezyAllowedStoreIds;
        if (config.lemonsqueezyMaxRefundAmountCents != null) env.LEMONSQUEEZY_MAX_REFUND_AMOUNT_CENTS = String(config.lemonsqueezyMaxRefundAmountCents);
        if (config.lemonsqueezyDestructiveRateLimit != null) env.LEMONSQUEEZY_DESTRUCTIVE_RATE_LIMIT = String(config.lemonsqueezyDestructiveRateLimit);
        if (config.lemonsqueezyDisableClasses) env.LEMONSQUEEZY_DISABLE_CLASSES = config.lemonsqueezyDisableClasses;
        if (config.lemonsqueezyRateLimitPerClass) env.LEMONSQUEEZY_RATE_LIMIT_PER_CLASS = config.lemonsqueezyRateLimitPerClass;
        if (config.lemonsqueezyLog) env.LEMONSQUEEZY_LOG = config.lemonsqueezyLog;
        if (config.lemonsqueezySinkUrl) env.LEMONSQUEEZY_SINK_URL = config.lemonsqueezySinkUrl;
        if (config.lemonsqueezySinkAdminToken) env.LEMONSQUEEZY_SINK_ADMIN_TOKEN = config.lemonsqueezySinkAdminToken;
        return {
          command: 'npx',
          args: ['-y', '@yawlabs/lemonsqueezy-mcp'],
          env,
        };
      }
